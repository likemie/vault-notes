<!DOCTYPE html>
<html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoGebra</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  #ggb-host, #ggb {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
  }
</style>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>

<div id="ggb-host">

    document.body.textContent = msg;
    document.body.style.padding = "16px";
    document.body.style.fontFamily = "sans-serif";
    document.body.style.color = "#b00020";
  }
  function hostSize() {
    var host = document.getElementById("ggb-host");
    var w = host ? host.clientWidth : 0;
    var h = host ? host.clientHeight : 0;
    return {
      w: Math.max(Math.floor(w || window.innerWidth || 320), 100),
      h: Math.max(Math.floor(h || window.innerHeight || 640), 100)
    };
  }
  function applySize(api) {
    var s = hostSize();
    try {
      if (api && typeof api.setSize === "function") api.setSize(s.w, s.h);
      else if (window.ggbApplet && typeof window.ggbApplet.setSize === "function") {
        window.ggbApplet.setSize(s.w, s.h);
      }
    } catch (e) {}
  }
